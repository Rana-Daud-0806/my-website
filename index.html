<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    .card h2 { margin-bottom: 24px; color: #333; text-align: center; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; color: #666; font-size: 14px; }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #764ba2; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #764ba2;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #5c3982; }
    .footer-text { margin-top: 20px; text-align: center; font-size: 14px; color: #666; }
    .footer-text a { color: #764ba2; text-decoration: none; font-weight: bold; }
    .footer-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Welcome Back</h2>
    <form onsubmit="event.preventDefault(); alert('Logged in successfully!');">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    <div class="footer-text">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>

</body>
</html>
